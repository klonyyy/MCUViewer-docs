# This file was created automatically with `jupyter-book init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        run: jupyter-book build --html
      # mystmd writes http://localhost:3000 into sitemap.xml, robots.txt and the
      # page data (jupyter-book/mystmd#2695), so search engines got a sitemap
      # full of localhost URLs. Remove this step once that is fixed upstream.
      - name: Fix localhost URLs
        run: grep -rlZ 'http://localhost:3000' _build/html | xargs -0 -r sed -i 's#http://localhost:3000#https://docs.mcuviewer.com#g'
      # GitHub Pages serves page/index.html at page/ and 301-redirects page to it, so list
      # the final URLs - a sitemap of redirects shows up as "Page with redirect" in Search Console.
      - name: Add trailing slashes to sitemap URLs
        run: sed -i 's#<loc>\(https://docs.mcuviewer.com[^<]*[^/<]\)</loc>#<loc>\1/</loc>#' _build/html/sitemap.xml
      # Link previews (LinkedIn, Slack, ...) need an absolute og:image URL, mystmd writes /build/...
      - name: Make preview image URLs absolute
        run: find _build/html -name '*.html' -exec sed -i 's#\(<meta [a-z]*="\(og:\)\{0,1\}image" content="\)/#\1https://docs.mcuviewer.com/#g' {} +
      # Canonical and og:url tags, no BASE_URL fallback dialog in the page text, llms.txt and llms-full.txt.
      - name: Post-process HTML for search engines and AI crawlers
        run: python3 tools/postprocess_site.py _build/html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
